name: Fix result portals
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update links
        run: |
          python -c 'from pathlib import Path; p=Path("gls-checker/src/App.js"); s=p.read_text(); old="    const newCodesMsg =\n`\${codesSection}\n\n🌐 Check results at:\neresults.waecgh.org (WASSCE)\nbece.waecgh.org (BECE)`;"; new="    let portalSection = \"🌐 Check results at:\";\n\n    if (wCheckers.length > 0) {\n      portalSection += \"\\nWASSCE: https://ghana.waecdirect.org/\";\n    }\n\n    if (bCheckers.length > 0) {\n      portalSection += \"\\nBECE: https://eresults.waecgh.org\";\n    }\n\n    const newCodesMsg =\n`\${codesSection}\n\n\${portalSection}`;"; assert old in s, "portal block not found"; p.write_text(s.replace(old,new,1))'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gls-checker/src/App.js
          git commit -m "Fix WAEC result portal links"
          git push

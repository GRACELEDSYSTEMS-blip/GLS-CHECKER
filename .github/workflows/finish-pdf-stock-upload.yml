name: Finish PDF Stock Upload

on:
  push:
    paths:
      - '.github/workflows/finish-pdf-stock-upload.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch direct PDF upload
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('gls-checker/src/App.js')
          s = p.read_text()

          # PDF.js import + worker
          anchor = 'import SecurityGate from "./SecurityGate";\n'
          if 'from "pdfjs-dist"' not in s:
              s = s.replace(anchor, anchor + 'import { getDocument, GlobalWorkerOptions } from "pdfjs-dist";\n\nGlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";\n', 1)

          # PDF parser helper
          parser_anchor = '// ── ICONS ────────────────────────────────────────────────\n'
          if 'async function parseCheckerPDF' not in s:
              helper = r'''async function parseCheckerPDF(file) {
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await getDocument({ data }).promise;
  const pages = [];

  for (let pageNo = 1; pageNo <= pdf.numPages; pageNo += 1) {
    const page = await pdf.getPage(pageNo);
    const content = await page.getTextContent();
    pages.push(content.items.map((item) => item.str).join("\n"));
  }

  const text = pages.join("\n");
  const detectedType = /\bBECE\b/i.test(text)
    ? "BECE"
    : /\bWASSCE\b/i.test(text)
      ? "WASSCE"
      : null;

  const codes = [];
  const regex = /Serial\s*:\s*([A-Z0-9-]+)[\s\S]{0,100}?PIN\s*:\s*([0-9]{6,20})/gi;
  let match;

  while ((match = regex.exec(text)) !== null) {
    codes.push({
      serial: match[1].trim(),
      pin: match[2].trim(),
      used: false,
    });
  }

  return { codes, detectedType };
}

'''
              s = s.replace(parser_anchor, helper + parser_anchor, 1)

          # pending upload state
          state_anchor = '  const [uploadErr, setUploadErr] = useState("");\n'
          if 'const [pendingUpload, setPendingUpload]' not in s:
              s = s.replace(state_anchor, state_anchor + '  const [pendingUpload, setPendingUpload] = useState(null);\n  const [uploadBusy, setUploadBusy] = useState(false);\n', 1)

          # replace upload handler block
          start = s.index('  // ── UPLOAD CSV ─')
          end = s.index('  // ── DELIVER ─', start)
          new_handler = r'''  // ── UPLOAD PDF / CSV ──────────────────────────────────
  async function handleFile(file) {
    if (!file) return;

    setUploadErr("");
    setUploadMsg("");
    setPendingUpload(null);
    setUploadBusy(true);

    try {
      const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
      let codes = [];
      let detectedType = null;

      if (isPdf) {
        const parsed = await parseCheckerPDF(file);
        codes = parsed.codes;
        detectedType = parsed.detectedType;
      } else {
        const text = await file.text();
        codes = parseCSV(text);
      }

      if (codes.length === 0) {
        setUploadErr(
          isPdf
            ? "No checker Serial/PIN pairs were found in this PDF."
            : "No valid codes found in this CSV."
        );
        return;
      }

      const type = detectedType || uploadType;
      const key = type.toLowerCase();
      const allExistingSerials = new Set([
        ...(pool.wassce || []).map((c) => c.serial.toUpperCase()),
        ...(pool.bece || []).map((c) => c.serial.toUpperCase()),
      ]);
      const seen = new Set();
      const valid = [];
      let duplicates = 0;
      let invalid = 0;

      codes.forEach((code) => {
        const serial = String(code.serial || "").trim().toUpperCase();
        const pin = String(code.pin || "").trim();
        const isValid = /^[A-Z0-9-]{5,40}$/.test(serial) && /^\d{6,20}$/.test(pin);

        if (!isValid) {
          invalid += 1;
          return;
        }

        if (seen.has(serial) || allExistingSerials.has(serial)) {
          duplicates += 1;
          return;
        }

        seen.add(serial);
        valid.push({ serial, pin, used: false });
      });

      setPendingUpload({
        fileName: file.name,
        source: isPdf ? "PDF" : "CSV",
        type,
        codes: valid,
        found: codes.length,
        duplicates,
        invalid,
      });

      if (detectedType && detectedType !== uploadType) {
        setUploadType(detectedType);
      }
    } catch (error) {
      console.error(error);
      setUploadErr("Could not read this file. Please try the original retailer PDF or a CSV file.");
    } finally {
      setUploadBusy(false);
    }
  }

  async function confirmPendingUpload() {
    if (!pendingUpload || pendingUpload.codes.length === 0) return;

    const key = pendingUpload.type.toLowerCase();
    const newPool = {
      ...pool,
      [key]: [...(pool[key] || []), ...pendingUpload.codes],
    };

    await persistPool(newPool);

    const count = pendingUpload.codes.length;
    setUploadMsg(`✅ ${count} ${pendingUpload.type} checker${count === 1 ? "" : "s"} added to Unused Stock.`);
    setPendingUpload(null);
    setUploadErr("");
    setTimeout(() => setUploadMsg(""), 5000);
  }

'''
          s = s[:start] + new_handler + s[end:]

          # update stock upload title/text/input
          s = s.replace('<UploadIcon /> Upload Checker CSV', '<UploadIcon /> Upload Checker PDF / CSV')
          s = s.replace('Tap to upload CSV file', '{uploadBusy ? "Reading file…" : "Tap to upload PDF or CSV"}')
          s = s.replace('accept=".csv"', 'accept=".pdf,.csv,application/pdf,text/csv"')

          # insert preview before file input
          input_anchor = '''              <input
                ref={fileRef}
                type="file"'''
          if 'Review before adding to stock' not in s:
              preview = r'''              {pendingUpload && (
                <div
                  style={{
                    background: "#F8FAFC",
                    border: "1.5px solid #D9DEE8",
                    borderRadius: 12,
                    padding: 14,
                    marginBottom: 14,
                  }}
                >
                  <div style={{ fontWeight: 900, color: "#0A1F5C", marginBottom: 6 }}>
                    Review before adding to stock
                  </div>
                  <div style={{ fontSize: 12, color: "#6B7280", lineHeight: 1.8 }}>
                    📄 {pendingUpload.fileName}<br />
                    🎓 {pendingUpload.type} · {pendingUpload.source}<br />
                    ✅ {pendingUpload.codes.length} new checker{pendingUpload.codes.length === 1 ? "" : "s"}<br />
                    🔁 {pendingUpload.duplicates} duplicate{pendingUpload.duplicates === 1 ? "" : "s"} skipped<br />
                    ⚠️ {pendingUpload.invalid} invalid entr{pendingUpload.invalid === 1 ? "y" : "ies"} skipped
                  </div>

                  {pendingUpload.codes.length > 0 ? (
                    <>
                      <div
                        style={{
                          marginTop: 10,
                          maxHeight: 150,
                          overflowY: "auto",
                          background: "#fff",
                          borderRadius: 9,
                          padding: "8px 10px",
                          fontFamily: "monospace",
                          fontSize: 11,
                          lineHeight: 1.7,
                        }}
                      >
                        {pendingUpload.codes.slice(0, 20).map((c) => (
                          <div key={c.serial}>{c.serial} · {c.pin}</div>
                        ))}
                        {pendingUpload.codes.length > 20 && (
                          <div>…and {pendingUpload.codes.length - 20} more</div>
                        )}
                      </div>
                      <button style={{ ...S.btnGold, marginTop: 12 }} onClick={confirmPendingUpload}>
                        Add {pendingUpload.codes.length} to Unused Stock
                      </button>
                    </>
                  ) : (
                    <div style={{ ...S.errBox, marginTop: 10, marginBottom: 0 }}>
                      Nothing new to add.
                    </div>
                  )}

                  <button
                    type="button"
                    style={{ ...S.btnRed, width: "100%", marginTop: 8 }}
                    onClick={() => setPendingUpload(null)}
                  >
                    Cancel
                  </button>
                </div>
              )}

'''
              s = s.replace(input_anchor, preview + input_anchor, 1)

          p.write_text(s)
          PY
      - name: Build app
        working-directory: gls-checker
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gls-checker/src/App.js gls-checker/package.json package-lock.json gls-checker/package-lock.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Add direct PDF checker stock upload with preview'
          git push

name: Finish PDF Stock Upload

on:
  push:
    paths:
      - '.github/workflows/finish-pdf-stock-upload.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch direct PDF upload
        run: |
          echo '' | base64 -d > /tmp/patch_pdf.py
          python /tmp/patch_pdf.py
      - name: Build app
        working-directory: gls-checker
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gls-checker/src/App.js gls-checker/package.json gls-checker/package-lock.json
          git diff --cached --quiet || git commit -m 'Add direct PDF checker stock upload with preview'
          git push

name: GLS Phase Two Upgrades

on:
  push:
    paths:
      - '.github/workflows/phase-two-upgrades.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app upgrades
        run: |
          echo 'REPLACE_B64' | base64 -d > /tmp/phase2.py
          python /tmp/phase2.py
      - name: Build app
        working-directory: gls-checker
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit upgrades
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gls-checker/src/App.js gls-checker/public/index.html gls-checker/package-lock.json
          git diff --cached --quiet || git commit -m 'Add dashboard lookup undo sale and settings'
          git push

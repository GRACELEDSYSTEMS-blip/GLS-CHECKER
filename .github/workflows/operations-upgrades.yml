name: GLS Operations Upgrades

on:
  push:
    paths:
      - '.github/workflows/operations-upgrades.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch operations upgrades
        run: python .github/scripts/operations-upgrades.py
      - name: Build app
        working-directory: gls-checker
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit upgrades
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gls-checker/src/App.js gls-checker/package-lock.json
          git diff --cached --quiet || git commit -m 'Add finance period reports and customer resend actions'
          git pull --rebase origin main
          git push

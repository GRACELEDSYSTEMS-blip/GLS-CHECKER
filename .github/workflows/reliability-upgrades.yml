name: GLS Reliability Upgrades

on:
  push:
    paths:
      - '.github/workflows/reliability-upgrades.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reliability upgrades
        run: |
          python .github/scripts/reliability-upgrades.py
          python .github/scripts/reliability-fix.py
      - name: Build app
        working-directory: gls-checker
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit upgrades
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gls-checker/src/App.js gls-checker/package-lock.json
          git diff --cached --quiet || git commit -m 'Add backup transaction editing duplicate checks and notifications'
          git push

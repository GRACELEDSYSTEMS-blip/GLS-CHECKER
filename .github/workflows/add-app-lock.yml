name: Add GLS App Lock

on:
  push:
    paths:
      - '.github/workflows/add-app-lock.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.js
        run: |
          echo '' | base64 -d > /tmp/patch_app.py
          python /tmp/patch_app.py
      - name: Build app
        working-directory: gls-checker
        run: |
          npm ci
          npm run build
      - name: Commit app lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gls-checker/src/App.js gls-checker/src/SecurityGate.js
          git diff --cached --quiet || git commit -m 'Add PIN and biometric lock screen'
          git push
